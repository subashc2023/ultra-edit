[package]
name = "ultra-edit"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Snapshot-based, verifiable batch file editing"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
same-file = "1"

[lints.rust]
unsafe_code = "forbid"
