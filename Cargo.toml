[package]
name = "ultra-edit"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Snapshot-based, verifiable batch file editing"
homepage = "https://github.com/subashc2023/ultra-edit"
repository = "https://github.com/subashc2023/ultra-edit"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["file-editing", "batch-editing", "mcp", "claude-code"]
categories = ["command-line-utilities", "development-tools"]
publish = false
default-run = "ultra-edit"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
same-file = "1"
rmcp = { version = "=3.2.0", default-features = false, features = ["server", "macros"] }
schemars = "1"
tokio = { version = "1", features = ["rt", "io-std", "sync"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = { version = "0.3", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
