# Shop workloads for staging and prod. Keep the two Deployments in step.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: shop-staging
  labels:
    app: shop
    env: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
      env: staging
  template:
    metadata:
      labels:
        app: shop
        env: staging
    spec:
      serviceAccountName: shop
      containers:
        - name: api
          image: registry.example.com/shop/api:2.4.1
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: DB_POOL_SIZE
              value: "10"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
        - name: worker
          image: registry.example.com/shop/worker:1.8.2
          args: ["--queue", "orders", "--concurrency", "4"]
          ports:
            - containerPort: 9090
              name: metrics
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: DB_POOL_SIZE
              value: "10"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
        - name: scheduler
          image: registry.example.com/shop/worker:1.8.2
          args: ["--schedule", "/etc/shop/cron.yaml"]
          env:
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: shop-prod
  labels:
    app: shop
    env: prod
spec:
  replicas: 4
  selector:
    matchLabels:
      app: shop
      env: prod
  template:
    metadata:
      labels:
        app: shop
        env: prod
    spec:
      serviceAccountName: shop
      containers:
        - name: api
          image: registry.example.com/shop/api:2.4.1
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: DB_POOL_SIZE
              value: "10"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
        - name: worker
          image: registry.example.com/shop/worker:1.8.2
          args: ["--queue", "orders", "--concurrency", "4"]
          ports:
            - containerPort: 9090
              name: metrics
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: DB_POOL_SIZE
              value: "10"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
        - name: scheduler
          image: registry.example.com/shop/worker:1.8.2
          args: ["--schedule", "/etc/shop/cron.yaml"]
          env:
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: shop-staging
spec:
  selector:
    app: shop
    env: staging
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: shop-prod
spec:
  selector:
    app: shop
    env: prod
  ports:
    - name: http
      port: 80
      targetPort: http
