# Service registry for the shop platform.
#
# One [services.<name>] table per deployable service. Keys that are left out
# fall back to config/defaults.toml. Keep tables grouped by owning team.

schema_version = 3

[services.auth-api]
description = "Auth api service"
port = 8080
protocol = "http"
replicas = 3
enabled = true
timeout_ms = 5000
retries = 1
region = "ap-southeast-2"
owner = "team-auth"
log_level = "warn"
health_check = "/healthz"
cpu = "1000m"
memory = "512Mi"
tags = ["public", "http"]

[services.auth-admin]
description = "Auth admin service"
port = 8080
protocol = "http"
replicas = 2
enabled = true
timeout_ms = 10000
retries = 2
region = "us-east-1"
owner = "team-auth"
log_level = "info"
health_check = "/healthz"
cpu = "250m"
memory = "256Mi"
tags = ["internal", "http"]

