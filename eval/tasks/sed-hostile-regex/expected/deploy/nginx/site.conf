server {
    listen 443 ssl http2;
    server_name acme.example www.acme.example;
    root /srv/acme/public;

    # Static assets: long cache.
    location ~* \.(png|jpe?g|gif|svg|ico|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location ~* \.(css|js)$ {
        expires 7d;
    }

    # Legacy URLs.
    rewrite ^/old/(.*)$ /archive/$1?from=old&v=2 permanent;
    rewrite ^/blog/(\d{4})/(\d{2})/(.+)$ /posts/$1-$2/$3 permanent;
    rewrite ^/docs/v1/(.*)$ /docs/latest/$1 redirect;

    location ~ ^/api/(v[12])/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}