name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.89.0
  RUST_SOURCE_COMMIT: 29483883eed69d5fb4db01964cdf2af4d86e9cb2
  RUST_LLVM_COMMIT: 9b1bf4cf041c1c1fe62cf03891ac90431615e780
  CLAUDE_CODE_VERSION: 2.1.263

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Release workflows must run from a tag." >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          event_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$event_commit" || "$head_commit" != "$event_commit" ]]; then
            echo "The checked-out commit does not match the triggering tag." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$event_commit" origin/main; then
            echo "The release commit is not reachable from origin/main." >&2
            exit 1
          fi

          python scripts/release.py verify-version --tag "$GITHUB_REF_NAME"

      - name: Test release packaging
        run: python -m unittest discover -s scripts/tests -v

      - name: Install Rust for validation
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" \
            --profile minimal \
            --component rustfmt \
            --component clippy

      - name: Check formatting
        run: cargo +${{ env.RUST_VERSION }} fmt --all -- --check

      - name: Lint
        run: cargo +${{ env.RUST_VERSION }} clippy --locked --all-targets -- -D warnings

      - name: Check
        run: cargo +${{ env.RUST_VERSION }} check --locked --all-targets

      - name: Check Rust standard library licenses
        shell: bash
        run: |
          set -euo pipefail
          rust_sysroot="$(rustc +"$RUST_VERSION" --print sysroot)"
          cmp \
            RUST_STANDARD_LIBRARY_LICENSES.html \
            "$rust_sysroot/share/doc/rust/COPYRIGHT-library.html"

      - name: Check musl license notice
        shell: bash
        run: |
          printf '%s  %s\n' \
            'f9bc4423732350eb0b3f7ed7e91d530298476f8fec0c6c427a1c04ade22655af' \
            MUSL_COPYRIGHT \
            | sha256sum --check --strict

      - name: Check LLVM libunwind license notice
        shell: bash
        run: |
          printf '%s  %s\n' \
            'b5efebcaca80879234098e52d1725e6d9eb8fb96a19fce625d39184b705f7b6d' \
            LLVM_LIBUNWIND_LICENSE.txt \
            | sha256sum --check --strict

      - name: Check Rust compiler runtime license notices
        shell: bash
        run: |
          set -euo pipefail
          check_notice() {
            local file="$1"
            local expected_sha256="$2"
            local source_url="$3"
            local upstream="$RUNNER_TEMP/$file.upstream"
            printf '%s  %s\n' "$expected_sha256" "$file" \
              | sha256sum --check --strict
            curl --fail --silent --show-error --location \
              "$source_url" --output "$upstream"
            cmp "$file" "$upstream"
          }
          check_notice \
            RUST_COMPILER_BUILTINS_LICENSE.txt \
            ab6eec6caf0fa5775e411c7a8bc6a45c4ef2956b0980b157ab74fc5cd62a928b \
            "https://raw.githubusercontent.com/rust-lang/rust/$RUST_SOURCE_COMMIT/library/compiler-builtins/LICENSE.txt"
          check_notice \
            RUST_LIBM_LICENSE.txt \
            3823dda7cf046602f4b4e77ec8e227863dc4736037cc85bb33d9f19febe16bb7 \
            "https://raw.githubusercontent.com/rust-lang/rust/$RUST_SOURCE_COMMIT/library/compiler-builtins/libm/LICENSE.txt"
          check_notice \
            LLVM_COMPILER_RT_LICENSE.txt \
            1a8f1058753f1ba890de984e48f0242a3a5c29a6a8f2ed9fd813f36985387e8d \
            "https://raw.githubusercontent.com/rust-lang/llvm-project/$RUST_LLVM_COMMIT/compiler-rt/LICENSE.TXT"

      - name: Check Cargo dependency licenses
        shell: bash
        run: |
          set -euo pipefail
          about_root="$RUNNER_TEMP/cargo-about"
          about="$about_root/bin/cargo-about"
          cargo +${{ env.RUST_VERSION }} install cargo-about \
            --version '=0.9.2' \
            --locked \
            --features cli \
            --root "$about_root"
          [[ "$("$about" --version)" == "cargo-about 0.9.2" ]]
          generated="$(mktemp)"
          "$about" generate \
            --locked \
            --fail \
            third-party-licenses.hbs \
            --output-file "$generated"
          cmp THIRD_PARTY_LICENSES.txt "$generated"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            rustflags: -C target-feature=+crt-static
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            rustflags: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            rustflags: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            rustflags: ""
          - runner: macos-15
            target: aarch64-apple-darwin
            rustflags: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      TARGET: ${{ matrix.target }}
      RUSTFLAGS: ${{ matrix.rustflags }}
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      ARCHIVE: dist/ultra-edit-plugin-${{ github.ref_name }}-${{ matrix.target }}.zip
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install musl tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools

      - name: Install Rust
        shell: bash
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"

      - name: Test
        shell: bash
        run: |
          cargo +"$RUST_VERSION" test --locked --all-targets --target "$TARGET"
          cargo +"$RUST_VERSION" test --locked --doc --target "$TARGET"

      - name: Build release binaries
        shell: bash
        run: cargo +"$RUST_VERSION" build --locked --release --bins --target "$TARGET"

      - name: Verify static Linux binaries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v readelf >/dev/null; then
            echo "readelf is required to verify the Linux release binaries." >&2
            exit 1
          fi
          for binary in \
            "target/$TARGET/release/ultra-edit" \
            "target/$TARGET/release/ultra-edit-mcp"; do
            if ! program_headers="$(readelf --program-headers "$binary")"; then
              echo "readelf could not inspect the program headers in $binary." >&2
              exit 1
            fi
            if grep --quiet '[[:space:]]INTERP[[:space:]]' <<<"$program_headers"; then
              echo "$binary contains a dynamic interpreter segment." >&2
              exit 1
            fi
            if ! dynamic_section="$(readelf --dynamic "$binary")"; then
              echo "readelf could not inspect the dynamic section in $binary." >&2
              exit 1
            fi
            if grep --quiet '(NEEDED)' <<<"$dynamic_section"; then
              echo "$binary contains a dynamic library dependency." >&2
              exit 1
            fi
          done

      - name: Verify static Windows CRT linkage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere is required to locate dumpbin: $vswhere"
          }
          $vswhereArguments = @(
            '-latest'
            '-products'
            '*'
            '-requires'
            'Microsoft.VisualStudio.Component.VC.Tools.x86.x64'
            '-find'
            'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe'
          )
          $dumpbin = & $vswhere @vswhereArguments | Select-Object -First 1
          if ($LASTEXITCODE -ne 0 -or -not $dumpbin -or -not (Test-Path -LiteralPath $dumpbin)) {
            throw 'dumpbin is required to verify the Windows release binaries.'
          }

          foreach ($name in 'ultra-edit.exe', 'ultra-edit-mcp.exe') {
            $binary = Join-Path "target/$env:TARGET/release" $name
            if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
              throw "Release binary is missing: $binary"
            }
            $dependencies = & $dumpbin /dependents $binary 2>&1
            if ($LASTEXITCODE -ne 0) {
              throw "dumpbin could not inspect $binary"
            }
            $dependencyText = $dependencies -join "`n"
            Write-Host $dependencyText
            if ($dependencyText -match '(?im)^\s*(?:vcruntime\S*|msvcp\S*|msvcr\S*|ucrtbase\S*|api-ms-win-crt-\S*)\.dll\s*$') {
              throw "$binary imports a dynamically linked Microsoft C runtime."
            }
          }

      - name: Verify macOS system library linkage
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for binary in \
            "target/$TARGET/release/ultra-edit" \
            "target/$TARGET/release/ultra-edit-mcp"; do
            dependencies="$(otool -L "$binary")"
            while IFS= read -r line; do
              library="${line#"${line%%[![:space:]]*}"}"
              library="${library%% *}"
              case "$library" in
                /usr/lib/*|/System/Library/*)
                  ;;
                *)
                  echo "$binary imports a non-system library: $library" >&2
                  exit 1
                  ;;
              esac
            done < <(tail -n +2 <<<"$dependencies")
          done

      - name: Package and inspect the target archive
        shell: bash
        run: |
          python scripts/release.py package-thin \
            --target "$TARGET" \
            --binary-dir "target/$TARGET/release" \
            --output "$ARCHIVE"
          python scripts/release.py verify-archive --archive "$ARCHIVE" --target "$TARGET"

      - name: Smoke-test the packaged binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf smoke
          mkdir smoke
          unzip -q "$ARCHIVE" -d smoke
          version="${GITHUB_REF_NAME#v}"
          [[ "$(smoke/runtime/ultra-edit --version)" == "ultra-edit $version" ]]
          [[ "$(smoke/runtime/ultra-edit-mcp --version)" == "ultra-edit-mcp $version" ]]

      - name: Smoke-test the packaged binaries on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath $env:ARCHIVE -DestinationPath smoke
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $cliVersion = & .\smoke\runtime\ultra-edit.exe --version
          if ($LASTEXITCODE -ne 0 -or $cliVersion -ne "ultra-edit $version") {
            throw "Unexpected ultra-edit version: $cliVersion"
          }
          $mcpVersion = & .\smoke\runtime\ultra-edit-mcp.exe --version
          if ($LASTEXITCODE -ne 0 -or $mcpVersion -ne "ultra-edit-mcp $version") {
            throw "Unexpected ultra-edit-mcp version: $mcpVersion"
          }

      - name: Upload the target archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thin-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7

  aggregate:
    name: Assemble release assets
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      release_artifact_id: ${{ steps.upload_release_assets.outputs['artifact-id'] }}
    env:
      FAT_ARCHIVE: dist/ultra-edit-plugin-${{ github.ref_name }}-all.zip
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download target archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: thin-*
          path: artifacts/thin
          merge-multiple: true

      - name: Assemble and inspect the complete plugin
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t thin_archives < <(find artifacts/thin -maxdepth 1 -type f -name '*.zip' -print | sort)
          if [[ "${#thin_archives[@]}" -ne 5 ]]; then
            echo "Expected five target archives, found ${#thin_archives[@]}." >&2
            exit 1
          fi

          mkdir -p dist staging
          cp -- "${thin_archives[@]}" dist/
          python scripts/release.py package-all \
            --input-dir artifacts/thin \
            --output "$FAT_ARCHIVE"
          python scripts/release.py verify-archive --archive "$FAT_ARCHIVE" --all
          unzip -q "$FAT_ARCHIVE" -d staging

      - name: Smoke-test the Linux launchers
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test -x staging/runtime/ultra-edit
          test -x staging/runtime/ultra-edit-mcp
          [[ "$(staging/runtime/ultra-edit --version)" == "ultra-edit $version" ]]
          [[ "$(staging/runtime/ultra-edit-mcp --version)" == "ultra-edit-mcp $version" ]]

      - name: Generate release metadata
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release.py write-metadata \
            --archive "$FAT_ARCHIVE" \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --marketplace-output dist/marketplace.json \
            --checksums-output dist/SHA256SUMS \
            --asset-dir dist
          python -m json.tool dist/marketplace.json >/dev/null
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload release assets
        id: upload_release_assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7

  claude_validate:
    name: Validate Claude manifests
    needs: aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      FAT_ARCHIVE: dist/ultra-edit-plugin-${{ github.ref_name }}-all.zip
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.aggregate.outputs.release_artifact_id }}
          path: dist

      - name: Inspect the candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          mkdir staging
          unzip -q "$FAT_ARCHIVE" -d staging

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Validate the Claude Code plugin and marketplace
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          claude --version | grep --fixed-strings "$CLAUDE_CODE_VERSION"
          claude plugin validate staging --strict --json
          claude plugin validate dist/marketplace.json --strict --json

  attest:
    name: Attest release assets
    needs:
      - aggregate
      - claude_validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.aggregate.outputs.release_artifact_id }}
          path: dist

      - name: Verify release checksums
        shell: bash
        run: (cd dist && sha256sum --check SHA256SUMS)

      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  publish:
    name: Publish GitHub release
    needs:
      - aggregate
      - attest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.aggregate.outputs.release_artifact_id }}
          path: dist

      - name: Recheck the tag and assets
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          event_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$event_commit" || "$head_commit" != "$event_commit" ]]; then
            echo "The release tag or checkout moved after this workflow started." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$event_commit" origin/main; then
            echo "The release commit is no longer reachable from origin/main." >&2
            exit 1
          fi
          python scripts/release.py verify-version --tag "$GITHUB_REF_NAME"
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist -maxdepth 1 -type f -print | sort)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          release_title="Ultra Edit $GITHUB_REF_NAME"
          release_marker="<!-- ultra-edit-release:${GITHUB_REF_NAME}:${GITHUB_SHA} -->"
          release_already_published=false
          if release_json="$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json body,isDraft,isPrerelease,name 2>/dev/null)"; then
            if ! jq --exit-status \
              --arg marker "$release_marker" \
              --arg name "$release_title" \
              '.isPrerelease == false and
               .name == $name and
               (.body | startswith($marker + "\n"))' \
              <<<"$release_json" >/dev/null; then
              echo "Refusing to use a release that does not match this build." >&2
              exit 1
            fi
            if jq --exit-status '.isDraft == true' <<<"$release_json" >/dev/null; then
              echo "Resuming the existing draft release $GITHUB_REF_NAME."
            else
              release_already_published=true
              echo "Verifying the existing published release $GITHUB_REF_NAME."
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$release_title" \
              --notes "$release_marker" \
              --generate-notes \
              --draft
          fi

          if [[ "$release_already_published" == "false" ]]; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          fi

          for asset in "${assets[@]}"; do
            basename -- "$asset"
          done | sort >"$RUNNER_TEMP/local-release-assets"
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' \
            | sort >"$RUNNER_TEMP/remote-release-assets"
          if ! diff --unified \
            "$RUNNER_TEMP/local-release-assets" \
            "$RUNNER_TEMP/remote-release-assets"; then
            echo "The release asset set does not match this build." >&2
            exit 1
          fi

          remote_dir="$(mktemp -d "$RUNNER_TEMP/release-assets.XXXXXX")"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$remote_dir"
          cmp dist/SHA256SUMS "$remote_dir/SHA256SUMS"
          (cd "$remote_dir" && sha256sum --check SHA256SUMS)

          if [[ "$release_already_published" == "false" ]]; then
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$release_title" \
              --prerelease=false \
              --draft=false
          fi

          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json body,isDraft,isPrerelease,name \
            | jq --exit-status \
              --arg marker "$release_marker" \
              --arg name "$release_title" \
              '.isDraft == false and
               .isPrerelease == false and
               .name == $name and
               (.body | startswith($marker + "\n"))' \
              >/dev/null
